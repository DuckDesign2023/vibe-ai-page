name: Deploy v5 to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "versions/v5/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # Publish the v5 landing as the site root (index.html + assets)
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: versions/v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
