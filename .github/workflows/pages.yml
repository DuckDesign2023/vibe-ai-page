name: Deploy landing to GitHub Pages

# Публикуем лендинг AI Coding (versions/v1-baseline) на GitHub Pages.
# Срабатывает при пуше в рабочую ветку и в main, либо вручную.
on:
  push:
    branches:
      - main
      - claude/optimistic-rubin-cXFU5
  workflow_dispatch:

# Права, необходимые для деплоя на Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Одновременно идёт только один деплой
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Автоматически включить Pages, если ещё не включён
          enablement: true

      - name: Assemble site (v1 at root, v2 at /v2/)
        run: |
          rm -rf _site
          mkdir -p _site
          cp -r versions/v1-baseline/. _site/
          mkdir -p _site/v2
          cp -r versions/v2/. _site/v2/

      - name: Upload site as artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Собранный сайт: v1 в корне, v2 в /v2/
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
