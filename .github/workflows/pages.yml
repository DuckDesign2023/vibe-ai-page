name: Deploy landing to GitHub Pages

# Публикуем лендинг AI Coding (versions/v1-baseline) на GitHub Pages.
# Срабатывает при пуше в рабочую ветку и в main, либо вручную.
on:
  push:
    branches:
      - main
      - claude/optimistic-rubin-cXFU5
  workflow_dispatch:

# Права, необходимые для деплоя на Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Одновременно идёт только один деплой
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Автоматически включить Pages, если ещё не включён
          enablement: true

      - name: Upload landing as artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Папка с самодостаточным index.html
          path: versions/v1-baseline

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
